[pytest]
minversion = 7.0
testpaths = tests
pythonpath = . dags plugins
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Playbook Section 9 Markers
markers =
    external_api: marks tests that communicate with external APIs (deselected by default in unit test runs)
    integration: marks integration tests requiring container dependencies or database
    slow: marks tests that execute extensive operations
    focus: marker used for focusing on a single active test during local development

addopts =
    -ra
    --strict-markers
    -m "not external_api"
    --ignore=tests/sample_files

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
